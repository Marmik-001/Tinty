<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ThemeReader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>ThemeReader</h1>
    <label class="switch">
      <input type="checkbox" id="enabledToggle" />
      <span>Enabled</span>
    </label>
  </header>

  <section class="site-row">
    <label>
      <input type="checkbox" id="disableSiteToggle" />
      Disable on <strong id="currentHost">this site</strong>
    </label>
  </section>

  <section class="site-row light-mode-fix-row">
    <label for="lightModeFixSelect" style="display: block; font-weight: 500; margin-bottom: 4px;">
      Light page readability:
    </label>
    <select id="lightModeFixSelect">
      <option value="none">Off (No fix)</option>
      <option value="luminance">1. Luminance Check (Dynamic contrast)</option>
      <option value="scoped-css">2. Scoped CSS &amp; Dark Scheme</option>
      <option value="adaptive">3. Adaptive Surface Mapping</option>
    </select>
    <span class="hint" id="lightModeFixHint">Prevents invisible text on white containers</span>
  </section>

  <section class="site-row">
    <label>
      <input type="checkbox" id="cascadeFixToggle" />
      Top-down cascade fix
    </label>
    <span class="hint">Removes opaque wrapper boxes &amp; corner artifacts</span>
  </section>

  <section>
    <h2>Theme</h2>
    <select id="themeSelect">
      <optgroup label="Built-in — Dark" id="builtinDarkGroup"></optgroup>
      <optgroup label="Built-in — Light" id="builtinLightGroup"></optgroup>
      <optgroup label="Your saved themes" id="customGroup"></optgroup>
    </select>
    <p id="status"></p>
  </section>

  <button id="openSettingsBtn" class="secondary">
    + Add / manage your own themes &amp; images
  </button>

  <footer>
    <span id="themeNameLabel"></span>
  </footer>

  <script src="builtin-themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
